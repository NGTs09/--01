<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>白娘子永鎮雷峰塔</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Serif TC','Microsoft JhengHei',serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#f0e6d2;overflow:hidden}@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-20px)}}@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@keyframes glow{0%,100%{text-shadow:0 0 10px #ffd700,0 0 20px #ffd700,0 0 30px #ff6b6b}50%{text-shadow:0 0 20px #ffd700,0 0 30px #ffd700,0 0 40px #ff6b6b,0 0 50px #ff6b6b}}.container{max-width:900px;width:90%;padding:40px;background:rgba(20,20,40,0.95);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.7),inset 0 0 50px rgba(255,215,0,0.1);border:2px solid rgba(255,215,0,0.3);position:relative;overflow:hidden}body::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,215,0,0.05) 0%,transparent 70%);animation:rotate 30s linear infinite;pointer-events:none}@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}#startScreen{text-align:center;animation:fadeIn 1s ease-out}.title{font-size:3.5em;margin-bottom:30px;background:linear-gradient(45deg,#ffd700,#ff6b6b,#4ecdc4,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:glow 3s ease-in-out infinite;font-weight:900;letter-spacing:8px;position:relative;z-index:1}.subtitle{font-size:1.3em;margin-bottom:50px;color:#b8a080;font-style:italic;opacity:0.9;position:relative;z-index:1}#startBtn{padding:20px 60px;font-size:1.5em;background:linear-gradient(135deg,#ff6b6b,#ffd700);border:none;border-radius:50px;color:#1a1a2e;font-weight:bold;cursor:pointer;transition:all 0.3s ease;box-shadow:0 10px 30px rgba(255,107,107,0.4);animation:float 3s ease-in-out infinite;font-family:inherit;position:relative;z-index:1}#startBtn:hover{transform:scale(1.1);box-shadow:0 15px 40px rgba(255,107,107,0.6)}#gameScreen{display:none;animation:fadeIn 0.8s ease-out;position:relative;z-index:1}.story-text{font-size:1.3em;line-height:2;margin-bottom:40px;text-align:justify;padding:30px;background:rgba(0,0,0,0.3);border-radius:15px;border-left:5px solid #ffd700;text-indent:2em;color:#e8dcc4}.choices{display:flex;flex-direction:column;gap:20px}.choice-btn{padding:18px 30px;font-size:1.2em;background:linear-gradient(135deg,rgba(78,205,196,0.2),rgba(78,205,196,0.4));border:2px solid #4ecdc4;border-radius:15px;color:#f0e6d2;cursor:pointer;transition:all 0.3s ease;text-align:left;font-family:inherit;position:relative;overflow:hidden}.choice-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.5s}.choice-btn:hover{transform:translateX(10px);background:linear-gradient(135deg,rgba(78,205,196,0.4),rgba(78,205,196,0.6));box-shadow:0 5px 20px rgba(78,205,196,0.5)}.choice-btn:hover::before{left:100%}.ending{text-align:center;padding:40px;background:linear-gradient(135deg,rgba(255,107,107,0.2),rgba(255,215,0,0.2));border-radius:20px;border:3px solid #ffd700;animation:fadeIn 0.8s ease-out}.ending h2{font-size:2.5em;margin-bottom:25px;color:#ffd700;text-shadow:0 0 20px #ffd700}.ending p{font-size:1.4em;line-height:1.8;color:#f0e6d2;margin-bottom:30px}.restart-btn{padding:15px 50px;font-size:1.2em;background:linear-gradient(135deg,#4ecdc4,#45b7aa);border:none;border-radius:50px;color:#1a1a2e;font-weight:bold;cursor:pointer;transition:all 0.3s ease;box-shadow:0 8px 25px rgba(78,205,196,0.4);font-family:inherit}.restart-btn:hover{transform:scale(1.05);box-shadow:0 12px 35px rgba(78,205,196,0.6)}.battle{text-align:center;padding:50px;background:radial-gradient(circle,rgba(255,0,0,0.2),rgba(139,0,0,0.3));border-radius:20px;border:3px solid #ff0000;animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(255,0,0,0.5)}50%{box-shadow:0 0 40px rgba(255,0,0,0.8)}}.battle h2{font-size:3em;color:#ff0000;text-shadow:0 0 30px #ff0000;margin-bottom:20px}.battle p{font-size:1.5em;color:#ffcccb}</style></head><body><div class="container"><div id="startScreen"><h1 class="title">白娘子永鎮雷峰塔</h1><p class="subtitle">一段跨越千年的愛恨糾葛</p><button id="startBtn">開始遊戲</button></div><div id="gameScreen"><div class="story-text" id="storyText"></div><div class="choices" id="choices"></div></div></div><script>const story={1:{text:"清明時節雨紛紛，路上行人欲斷魂。借問酒家何處有，牧童遙指杏花村。又一年清明,曉風殘月的清晨時分,空氣飄散著混濁微涼的腐朽氣息,你悠然地獨坐藥房掌櫃上的木製椅上,恰逢一名僧人行至店內,發出邀請。在清明節時,可前往「保叔塔寺」進行燒香祭拜祖先的活動,你思忖再三後,決定……",choices:[{text:"向表叔李仁請假,前往祭祀",next:2},{text:"留於藥房,固守崗位",ending:"你度過平靜無波瀾的一生,卻又會在某個時刻,瞬息心悸的感覺,恰如遺失了什物",type:"normal"}]},2:{text:"夕陽無限好,只是近黃昏。當天的畫布染上香火的色澤,你踏上返程的歸途。西湖景色依舊,朦朧的煙霧繚繞,不時,下了場不合時宜的西北雨,你搭上故友的船隻避雨,遠處一襲白衣的倩影,帶著一名丫環,向你招手吶喊……",choices:[{text:"你的紳士與良心,使你無法對需要幫助的人坐視不管",next:3},{text:"各人自掃門前雪,莫管他人瓦上霜",ending:"平靜的一日。宛如那西湖的湖水般,細雨也僅僅只波盪起一絲絲漣漪",type:"normal"}]},3:{text:"你心生憐憫,代付船錢,扶她上岸,該女子自稱白娘子為了答謝你。邀請你行至茶樓商討還錢事宜。",choices:[{text:"表明高雅風度,婉拒辭行",ending:"你的禮貌無形中建成了一道高高的牆",type:"normal"},{text:"立馬答應",ending:"高端的獵食者,往往以獵物的型態出場",type:"bad"},{text:"解釋今日天色漸晚,擇日再約",next:4}]},4:{text:"翌日,你以討傘為由,再訪白娘子宅。她備酒款待,表露心跡,贈五十兩白銀助你成家。你動心收下,歸家與姐夫姐商量親事,卻因銀子源自官庫,姐夫出首,你被捕入獄。是否供出白娘子?",choices:[{text:"否",ending:"認罪伏法,終老於孤獨的牢中",type:"bad"},{text:"是",next:5}]},5:{text:"官府搜宅,發現失竊的銀堆,白娘子消失,你被判以妖術盜竊,杖刑流放蘇州。或許是命運的眷顧使然,偶然間,你與白娘子再度相遇。對於白娘子的解釋,你是否願意表達諒解?",choices:[{text:"是",next:6},{text:"否",ending:"相濡以沫,不如……相忘於江湖",type:"normal"}]},6:{text:"在她的一番解釋之下,你原諒了他,並與她度過一段相對安穩幸福的婚姻生活,雖然其中不乏一些令你狐疑之處。直到七月初七,你至金山寺燒香,遇法海禪師,用的法力逼得白娘子顯形。",choices:[{text:"進入戰鬥",battle:true},{text:"進入戰鬥",battle:true}]}};function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function showStory(id){const s=story[id];document.getElementById('storyText').textContent=s.text;const c=document.getElementById('choices');c.innerHTML='';const shuffled=shuffle([...s.choices]);shuffled.forEach(choice=>{const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=choice.text;btn.onclick=()=>{if(choice.battle){showBattle()}else if(choice.ending){showEnding(choice.ending,choice.type)}else{showStory(choice.next)}};c.appendChild(btn)})}function showEnding(text,type){const title=type==='bad'?'Bad Ending':'Normal Ending';document.getElementById('storyText').style.display='none';document.getElementById('choices').innerHTML=`<div class="ending"><h2>${title}</h2><p>${text}</p><button class="restart-btn" onclick="restartGame()">重新開始</button></div>`}function showBattle(){document.getElementById('storyText').style.display='none';document.getElementById('choices').innerHTML='<div class="battle"><h2>⚔️ 戰鬥開始 ⚔️</h2><p>法海禪師 VS 白娘子</p><p style="margin-top:30px;font-size:2em;">水漫金山！</p></div>';setTimeout(()=>{showEnding('在激烈的戰鬥中,白娘子不敵法海,被鎮壓於雷峰塔下。你只能眼睜睜看著摯愛被永鎮塔中,直到海枯石爛……','bad')},3000)}function restartGame(){document.getElementById('storyText').style.display='block';document.getElementById('startScreen').style.display='block';document.getElementById('gameScreen').style.display='none'}function startGame(){document.getElementById('startScreen').style.display='none';document.getElementById('gameScreen').style.display='block';showStory(1)}document.getElementById('startBtn').onclick=startGame</script></body></html>
